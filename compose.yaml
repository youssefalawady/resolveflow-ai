name: resolveflow

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-resolveflow}
      POSTGRES_USER: ${POSTGRES_USER:-resolveflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resolveflow-local-only}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-resolveflow} -d ${POSTGRES_DB:-resolveflow}
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./apps/api
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://resolveflow:resolveflow-local-only@db:5432/resolveflow}
    command:
      - /bin/sh
      - -c
      - alembic upgrade head && uvicorn resolveflow_api.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./apps/api:/app

  web:
    build:
      context: ./apps/web
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:5173').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules

volumes:
  postgres_data:
  web_node_modules:
