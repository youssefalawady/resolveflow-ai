name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: resolveflow_test
          POSTGRES_USER: resolveflow
          POSTGRES_PASSWORD: resolveflow-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resolveflow -d resolveflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://resolveflow:resolveflow-test-only@localhost:5432/resolveflow_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install backend dependencies
        run: python -m pip install --editable "apps/api[dev]"

      - name: Lint backend
        run: ruff check apps/api

      - name: Check backend formatting
        run: ruff format --check apps/api

      - name: Type-check backend
        run: mypy apps/api/src

      - name: Apply migrations from zero
        working-directory: apps/api
        run: alembic upgrade head

      - name: Test backend
        run: pytest apps/api/tests

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Type-check frontend
        run: npm run typecheck

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build
